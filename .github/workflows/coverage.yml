name: Code Coverage (Codecov)

on:
  pull_request:
    paths:
      - '**'
      - '.github/workflows/**'
  push:
    branches: [main, master]
    paths:
      - '**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whole-module coverage (./...), tests built with -tags=integration so the
  # fleet's co-located //go:build integration files are exercised too. Floor
  # is the fleet-standard 75%, not the stricter local `make coverage-gate`
  # 90% floor: that local gate is deliberately scoped to ./internal/... only
  # (business logic); this job necessarily also covers cmd/ (the Cobra
  # command surface, more error-path branches) and cmd/platform-bootstrap
  # (a bare main() wrapper), which pull the whole-module number to ~88-89%.
  coverage:
    if: ${{ !github.event.pull_request.draft }}
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-coverage.yml@86fd6e3b73fbe6d4f83280ef2661605d441a20e3 # v1.4.0
    with:
      go-version: "1.25.8"
      working-directory: "."
      test-tags: "integration"
      coverage-threshold: 75
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Parallel gate on the same //go:build integration files via the dedicated
  # reusable workflow (auto-skips with an honest ::notice:: if none exist —
  # not the case here, this repo has real integration_test.go files).
  integration-coverage:
    if: ${{ !github.event.pull_request.draft }}
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-integration-coverage.yml@86fd6e3b73fbe6d4f83280ef2661605d441a20e3 # v1.4.0
    with:
      go-version: "1.25.8"
      working-directory: "."
      coverage-threshold: 75
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

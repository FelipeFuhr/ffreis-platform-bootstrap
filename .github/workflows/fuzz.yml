name: Fuzzing

on:
  schedule:
    - cron: "31 7 1 * *"  # monthly scattered (was: 0 2 1 * *)
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual run (optional)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    timeout-minutes: 30
    permissions:
      contents: read
    if: ${{ !github.event.pull_request.draft }}
    name: Go Fuzz
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25.13"
          cache: true

      - name: Fuzz internal/config split trimming
        run: go test ./internal/config -run=^$ -fuzz=FuzzSplitTrimmed -fuzztime=10s -timeout=60s

      - name: Fuzz internal/config account parsing
        run: go test ./internal/config -run=^$ -fuzz=FuzzParseAccounts -fuzztime=10s -timeout=60s

      - name: Fuzz cmd backend rendering
        run: go test ./cmd -run=^$ -fuzz=FuzzRenderBackendHCL -fuzztime=10s -timeout=60s

  notify-failure:
    needs: [fuzz]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ [CI] ${context.workflow} failed (${new Date().toISOString().split('T')[0]})`,
              body: [
                `**Workflow:** ${context.workflow}`,
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            });

name: DevOps / Automation

on:
  schedule:
    - cron: "40 5 22 * *"  # monthly scattered (was: 0 4 * * 0)
    - cron: "32 22 17 * *"  # monthly scattered (was: 0 6 * * 1)
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    timeout-minutes: 15
    permissions:
      id-token: write
      security-events: write
      contents: read
      actions: read
    if: |
      (vars.FLEET_SPOT_CI != 'true' || github.event_name == 'workflow_dispatch') &&
      vars.SCORECARD_ENABLED != 'false' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run OSSF Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_format: json
          results_file: scorecard.json
          publish_results: false

  stale:
    permissions:
      issues: write
      pull-requests: write
    if: |
      (vars.FLEET_SPOT_CI != 'true' || github.event_name == 'workflow_dispatch') &&
      vars.STALE_ENABLED != 'false' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-stale.yml@ce7169b36bd25b1c4c0c8077aa78ecde6d6ca7d5  # v1.6.0
    with:
      only: "both"

      runner: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest"]' || '["self-hosted","spot","linux","x64"]' }}
  verify-release-please:
    timeout-minutes: 30
    permissions:
      contents: read
    if: vars.RELEASE_PLEASE_ENABLED != 'false' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Verify Release Please credentials
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_PLEASE_TOKEN}" ]; then
            echo "::error title=Release Please not configured::Missing RELEASE_PLEASE_TOKEN secret."
            echo "Add in: Settings → Secrets and variables → Actions → New repository secret"
            echo "To skip this job entirely: Settings → Variables → add RELEASE_PLEASE_ENABLED=false"
            exit 1
          fi

  release-please:
    needs: [verify-release-please]
    permissions:
      contents: write
      pull-requests: write
    if: vars.RELEASE_PLEASE_ENABLED != 'false' && github.event_name == 'push'
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-release-please.yml@ce7169b36bd25b1c4c0c8077aa78ecde6d6ca7d5  # v1.6.0
    with:
      target-branch: "main"
    secrets:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}

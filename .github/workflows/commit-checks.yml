name: Commit Checks

on:
  pull_request:
    paths:
      - '**'
      - '.github/workflows/**'
  push:
    branches: [main, master]
    paths:
      - '**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mod-tidy:
    name: go mod tidy (clean)
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-mod-tidy-check.yml@a543ef895b5c2d6e4e7fe87245d440889c485b7c
    with:
      go-version: "1.25.9"
      working-directory: "."

  fmt:
    name: Format (gofmt)
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-fmt.yml@a543ef895b5c2d6e4e7fe87245d440889c485b7c
    with:
      go-version: "1.25.9"
      working-directory: "."

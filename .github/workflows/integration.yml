name: Integration Tests

on:
  pull_request:
    paths:
      - '**'
      - '.github/workflows/**'
  push:
    branches: [main, master]
    paths:
      - '**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    if: ${{ !github.event.pull_request.draft }}
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-test.yml@a543ef895b5c2d6e4e7fe87245d440889c485b7c
    with:
      go-version: "1.25.9"
      working-directory: "."
      test-tags: "integration"
      run-govulncheck: false

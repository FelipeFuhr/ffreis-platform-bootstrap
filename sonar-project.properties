sonar.projectKey=ffreis-platform-bootstrap
sonar.organization=felipefuhr
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.go.coverage.reportPaths=coverage.out

# Suppress go:S100 (function naming) in test files.
# Go's standard convention for test functions uses underscores as sub-test
# separators (e.g. TestFoo_BarCondition), which conflicts with the camelCase
# regex enforced by S100. These names are intentional and idiomatic.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S100
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*_test.go